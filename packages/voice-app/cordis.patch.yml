# Voice interaction mode layered after dsh-base and dsh-web-app.
- insert:
    - id: voice
      name: '@wayneyu430227/dsh-voice'
      config:
        provider: local

    - id: voice-local
      name: '@wayneyu430227/dsh-voice-local'
      config:
        pythonPath: python
        workerScript: ../../../speech/worker.py
        modelDir: prototypes/local-voice-benchmark/vendor/MOSS-TTS-Nano/models
        ttsRoot: speech/moss_tts_runtime
        startupTimeoutMs: 120000
        inputSampleRate: 16000
        outputSampleRate: 48000

    - id: voice-assistant
      name: '@wayneyu430227/dsh-voice-assistant'
      config:
        maxPendingObservations: 64
        restoreConversation: true
        maxRestoredUtterances: 24
        taskSessionPolicy: continuous
        completedAnnouncement: 任务已完成。
        failedAnnouncement: 任务失败了，请查看屏幕上的错误信息。
        cancelledAnnouncement: 任务已取消。

    - id: voice-web
      name: '@wayneyu430227/dsh-voice-web'
      inject: [webRuntime]
      config:
        trustedHosts: !!js ctx.webRuntime.trustedHosts
        maxAudioFrameBytes: 65536

    - id: ui-voice
      name: '@wayneyu430227/dsh-client-ui-voice'
