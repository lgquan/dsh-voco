[project]
name = "dsh-live-local-voice-benchmark"
version = "0.0.0"
description = "Throwaway feasibility benchmark for the dsh-live local speech pipeline"
requires-python = ">=3.10,<3.11"
dependencies = [
  "funasr>=1.2.7",
  "modelscope>=1.20.0",
  "numpy>=1.26,<3",
  "onnxruntime>=1.18.0",
  "psutil>=6.0.0",
  "silero-vad>=6.0.0",
  "sounddevice>=0.5.0",
  "soundfile>=0.12.1",
  "torch>=2.4.0",
  "torchaudio>=2.4.0",
]

[tool.uv]
package = false

